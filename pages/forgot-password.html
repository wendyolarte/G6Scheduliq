<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Forgot Password – Scheduliq</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="auth-wrap">

    <div class="auth-art">

      <a href="../index.html" class="brand">
        <span class="logo">🎓</span>
        SchedulIq
      </a>

      <h2>Password Recovery</h2>

      <ul>
        <li>Recover access to your account</li>
        <li>Secure password-reset process</li>
        <li>Reset links expire after 30 minutes</li>
      </ul>

    </div>

    <div class="auth-form">

      <div class="auth-box">

        <h1>Forgot Password?</h1>

        <p class="muted">
          Enter your registered email address.
          We'll send you a link to reset your password.
        </p>

        <div id="message" class="alert hidden"></div>

        <form id="forgotForm">

          <div class="field">

            <label for="email">
              Email Address
            </label>

            <input
              id="email"
              type="email"
              placeholder="Enter your registered email"
              required
              autocomplete="email">

          </div>

          <button
            class="btn block lg"
            id="submitBtn"
            type="submit">

            Send Reset Link

          </button>

        </form>

        <p class="center small" style="margin-top:1rem">

          <a href="login.html">
            ← Back to Login
          </a>

        </p>

      </div>

    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/forgot-password.js"></script>

</body>
</html>
