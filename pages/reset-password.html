<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Reset Password – Scheduliq</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="auth-wrap">

    <div class="auth-art">

      <a href="../index.html" class="brand">
        <span class="logo">🎓</span>
        SchedulIq
      </a>

      <h2>Create a New Password</h2>

      <ul>
        <li>Choose a secure new password</li>
        <li>Your reset link can only be used once</li>
        <li>Reset links expire after 30 minutes</li>
      </ul>

    </div>

    <div class="auth-form">

      <div class="auth-box">

        <h1>Reset Password</h1>

        <p class="muted">
          Enter and confirm your new password.
        </p>

        <div id="message" class="alert hidden"></div>

        <form id="resetForm">

          <div class="field">

            <label for="password">
              New Password
            </label>

            <input
              id="password"
              type="password"
              minlength="8"
              required
              autocomplete="new-password"
              placeholder="At least 8 characters">

          </div>

          <div class="field">

            <label for="confirmPassword">
              Confirm New Password
            </label>

            <input
              id="confirmPassword"
              type="password"
              minlength="8"
              required
              autocomplete="new-password"
              placeholder="Enter your password again">

          </div>

          <button
            class="btn block lg"
            id="submitBtn"
            type="submit">

            Reset Password

          </button>

        </form>

        <p class="center small" style="margin-top:1rem">

          <a href="login.html">
            ← Back to Login
          </a>

        </p>

      </div>

    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/reset-password.js"></script>

</body>
</html>
